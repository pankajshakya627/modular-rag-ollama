[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-rag-ollama"
version = "1.0.0"
description = "A production-grade, modular RAG framework powered by Ollama. Featuring LangGraph orchestration, Hybrid Search, HyDE, and RAPTOR for advanced document retrieval and reasoning."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Modular RAG Team"}
]
keywords = [
    "rag", "retrieval-augmented-generation", "llm", "nlp",
    "hyde", "raptor", "hybrid-search", "langgraph", "ollama"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "langchain>=0.3.0,<0.4.0",
    "langchain-community>=0.3.0,<0.4.0",
    "langchain-core>=0.3.0,<0.4.0",
    "langchain-ollama>=0.2.0,<0.3.0",
    "langchain-text-splitters>=0.3.0,<0.4.0",
    "langgraph>=0.2.55,<0.4.0",
    "langgraph-checkpoint-sqlite>=1.0.0,<2.0.0",
    "chromadb>=0.5.0,<1.0.0",
    "faiss-cpu>=1.8.0,<2.0.0",
    "rank-bm25>=0.2.2,<0.3.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "tenacity>=8.3.0,<9.0.0",
    "structlog>=24.1.0,<25.0.0",
    "slowapi>=0.1.9,<0.2.0",
    "prometheus-client>=0.20.0,<1.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "numpy>=1.26.0,<3.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "transformers>=4.40.0,<5.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "pypdf>=4.0.0,<5.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "uuid7>=0.1.0,<0.2.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "mypy",
    "flake8",
    "pytest-cov",
    "httpx",
]

[project.scripts]
modular-rag = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
